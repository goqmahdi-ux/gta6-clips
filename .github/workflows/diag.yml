name: diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          for v in 4IgHlghwzu4 EalcorhuBLk h9SfcX9PWnw MLL4bKIfUes QgHrFreP9J0 kPodu0c8vHQ; do
            c=$(curl -s -m 15 -o /tmp/o -w "%{http_code}" "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$v&format=json")
            echo "OEMBED $v $c $(head -c 120 /tmp/o | tr '\n' ' ')"
            p=$(curl -s -m 20 -L -H "Accept-Language: en" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" "https://www.youtube.com/shorts/$v")
            echo "PAGE $v views=$(echo "$p" | grep -o '"viewCount":"[0-9]*"' | head -1) status=$(echo "$p" | grep -o '"playabilityStatus":{"status":"[A-Z_]*"[^}]\{0,160\}' | head -1 | cut -c1-220) private=$(echo "$p" | grep -o '"isPrivate":[a-z]*' | head -1) unlisted=$(echo "$p" | grep -o '"isUnlisted":[a-z]*' | head -1) family=$(echo "$p" | grep -o '"isFamilySafe":[a-z]*' | head -1)"
          done
          K=$(echo -n "$ZERNIO_API_KEY" | tr -d '[:space:]')
          curl -s -m 30 -H "Authorization: Bearer $K" -H "Accept: application/json" "https://zernio.com/api/v1/analytics?limit=3&platform=youtube" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); print('ANALYTICS', json.dumps(d,ensure_ascii=False)[:1500])"
