name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s -m 20 -H "User-Agent: gta6-clips-bot/1.0" -H "Accept: application/json" "https://kick.com/api/v2/categories/grand-theft-auto-vi/clips?sort=view&time=day" > /tmp/o
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/o')); c=d["clips"]; print("N",len(c),"KEYS",list(d.keys()))
          x=dict(c[0]); print("ITEM",json.dumps({k:(v if not isinstance(v,(dict,list)) else (list(v.keys()) if isinstance(v,dict) else "list")) for k,v in x.items()})[:900])
          print("CH",json.dumps(x.get("channel"))[:300]); print("CAT",json.dumps(x.get("category"))[:200])
          for y in c[:8]: print("ROW",y.get("created_at"),y.get("view_count",y.get("views")),y.get("duration"),(y.get("channel") or {}).get("slug"),y.get("title"))
          PY
