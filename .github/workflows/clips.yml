name: gta6-clips
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "تجربة على GTA V"
        type: boolean
        default: false
      publish_test:
        description: "انشر مقطع تجربة واحد على يوتيوب"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: clips
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore site
        run: |
          git clone --depth=1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site || mkdir -p site
          rm -rf site/.git
          mkdir -p site/v
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install -q -U yt-dlp
          yt-dlp --version
      - name: Run bot
        env:
          GTA6_SITE: site
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          PUBLISH_TEST: ${{ inputs.publish_test }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python3 gta6_bot.py once ${{ inputs.test && '--test' || '' }}
      - name: Publish
        run: |
          cp dashboard.html site/index.html
          touch site/.nojekyll
          cp data/bot.log site/last-run.log || true
          cd site
          git init -q -b gh-pages
          git config user.name "gta6-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "update $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
