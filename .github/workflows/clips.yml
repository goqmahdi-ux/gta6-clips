name: gta6-clips
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "تجربة على GTA V"
        type: boolean
        default: false
      dry:
        description: "بحث بس بدون قص"
        type: boolean
        default: false
      publish_test:
        description: "انشر مقاطع تجربة على يوتيوب"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: clips
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore site
        run: |
          git clone --depth=1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site || mkdir -p site
          rm -rf site/.git
          mkdir -p site/v
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install -q -U yt-dlp
          yt-dlp --version
      - name: Loop
        env:
          GTA6_SITE: site
          GH_TOKEN: ${{ github.token }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          PUBLISH_TEST: ${{ inputs.publish_test }}
          DRY: ${{ inputs.dry }}
          ONESHOT: ${{ inputs.test || inputs.dry || inputs.publish_test }}
          ARGS: ${{ inputs.test && '--test' || '' }}
        run: |
          # GitHub's cron proved unreliable here, so one run loops for ~5h20m and then starts the next run itself.
          end=$((SECONDS + 19200))
          while :; do
            git fetch -q origin main && git reset -q --hard origin/main || true
            python3 gta6_bot.py once $ARGS || true
            cp dashboard.html site/index.html
            touch site/.nojekyll
            tail -n 300 data/bot.log > site/last-run.log || true
            (cd site && rm -rf .git && git init -q -b gh-pages && git config user.name "gta6-bot" \
              && git config user.email "bot@users.noreply.github.com" && git add -A \
              && git commit -q -m "update $(date -u +%FT%TZ)" \
              && git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages; rm -rf .git) || true
            [ "$ONESHOT" = "true" ] && break
            [ $SECONDS -ge $end ] && break
            sleep 600
          done
          if [ "$ONESHOT" != "true" ]; then gh workflow run clips.yml --ref main -R "$GITHUB_REPOSITORY"; fi
